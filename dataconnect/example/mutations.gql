mutation UpsertUserProfile(
  $id: String!
  $name: String!
  $roleTitle: String!
  $fullLabel: String!
  $headerSubtitle: String!
  $department: String!
  $canApproveHead: Boolean!
  $canApproveIndependent: Boolean!
  $canApproveCae: Boolean!
  $employeeNumber: String
  $accountStatus: String!
  $failedLoginCount: Int!
  $isLocked: Boolean!
  $requiresPasswordChange: Boolean!
  $passwordHistory: [String!]!
  $mfaEnabled: Boolean!
  $isPrivileged: Boolean!
  $addedBy: String
  $modifiedBy: String
) @auth(level: USER) {
  userProfile_upsert(data: {
    id: $id
    name: $name
    roleTitle: $roleTitle
    fullLabel: $fullLabel
    headerSubtitle: $headerSubtitle
    department: $department
    canApproveHead: $canApproveHead
    canApproveIndependent: $canApproveIndependent
    canApproveCae: $canApproveCae
    employeeNumber: $employeeNumber
    accountStatus: $accountStatus
    failedLoginCount: $failedLoginCount
    isLocked: $isLocked
    requiresPasswordChange: $requiresPasswordChange
    passwordHistory: $passwordHistory
    mfaEnabled: $mfaEnabled
    isPrivileged: $isPrivileged
    createdAt_expr: "request.time"
    updatedAt_expr: "request.time"
    addedBy: $addedBy
    modifiedBy: $modifiedBy
    modifiedAt_expr: "request.time"
  })
}

mutation DeleteUserProfile($id: String!) @auth(level: USER) {
  userProfile_delete(id: $id)
}

