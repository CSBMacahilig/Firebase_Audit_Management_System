  year: Int!
  title: String!
  category: String!
  department: String!
  entityName: String! @col(name: "entity_name")
  likelihood: Int!
  impact: Int!
  riskScore: Int! @col(name: "risk_score")
  riskLevel: String! @col(name: "risk_level")
  lead: String!
  headReviewer: String! @col(name: "head_reviewer")
  independentReviewer: String! @col(name: "independent_reviewer")
  startDate: String! @col(name: "start_date")
  endDate: String! @col(name: "end_date")
  durationDays: Int! @col(name: "duration_days")
  budgetedHours: Int! @col(name: "budgeted_hours")
  status: String!
  readyRatio: String! @col(name: "ready_ratio")
  lifecycleStage: Int! @col(name: "lifecycle_stage")
  fieldworkPct: Int! @col(name: "fieldwork_pct")
  fieldworkDayCurrent: Int! @col(name: "fieldwork_day_current")
  fieldworkDayTotal: Int! @col(name: "fieldwork_day_total")
  reportStatus: String! @col(name: "report_status")
  reportRef: String! @col(name: "report_ref")
  executiveSummary: String! @col(name: "executive_summary")
  createdAt: Timestamp! @col(name: "created_at")
  updatedAt: Timestamp! @col(name: "updated_at")
  reportRating: String @col(name: "report_rating")
  addedBy: String @col(name: "added_by")
  modifiedBy: String @col(name: "modified_by")
  modifiedAt: Timestamp @col(name: "modified_at")
  auditDivisionId: String @col(name: "audit_division_id")
  objectives: String!
  scope: String!
  criteria: String!
  addresseeName: String! @col(name: "addressee_name")
  addresseeTitle: String! @col(name: "addressee_title")
  copyFurnished: String! @col(name: "copy_furnished")
}

