type UserProfile @table(name: "user_profiles") {
  id: String!
  name: String!
  roleTitle: String! @col(name: "role_title")
  fullLabel: String! @col(name: "full_label")
  headerSubtitle: String! @col(name: "header_subtitle")
  department: String!
  canApproveHead: Boolean! @col(name: "can_approve_head")
  canApproveIndependent: Boolean! @col(name: "can_approve_independent")
  canApproveCae: Boolean! @col(name: "can_approve_cae")
  employeeNumber: String @col(name: "employee_number")
  lastLoginDate: Timestamp @col(name: "last_login_date")
  accountModifiedAt: Timestamp @col(name: "account_modified_at")
  accountStatus: String! @col(name: "account_status")
  failedLoginCount: Int! @col(name: "failed_login_count")
  isLocked: Boolean! @col(name: "is_locked")
  requiresPasswordChange: Boolean! @col(name: "requires_password_change")
  passwordLastChanged: Timestamp @col(name: "password_last_changed")
  passwordHistory: [String!]! @col(name: "password_history")
  mfaEnabled: Boolean! @col(name: "mfa_enabled")
  isPrivileged: Boolean! @col(name: "is_privileged")
  createdAt: Timestamp! @col(name: "created_at")
  updatedAt: Timestamp! @col(name: "updated_at")
  addedBy: String @col(name: "added_by")
  modifiedBy: String @col(name: "modified_by")
  modifiedAt: Timestamp @col(name: "modified_at")
}

type SystemUser @table(name: "system_users") {
  id: String!
  username: String! @unique
  fullName: String! @col(name: "full_name")
  email: String!
  role: String!
  passwordHash: String! @col(name: "password_hash")
  isActive: Boolean! @col(name: "is_active")
  isLocked: Boolean! @col(name: "is_locked")
  failedLoginCount: Int! @col(name: "failed_login_count")
  requiresPasswordChange: Boolean! @col(name: "requires_password_change")
  createdAt: Timestamp! @col(name: "created_at")
  lastLogin: Timestamp @col(name: "last_login")
  modifiedAt: Timestamp! @col(name: "modified_at")
  addedBy: String @col(name: "added_by")
  modifiedBy: String @col(name: "modified_by")
}

type Engagement @table(name: "engagements") {
  id: String!
